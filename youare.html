  <script>
    function initializeInteraction(event) {
      console.log(`User interaction detected via event: ${event.type}`);
      const video = document.querySelector("video");
      if (!video) {
        console.error("No video element found on the page.");
        return;
      }
      video.style.display = "block";
      Array.from(document.querySelectorAll("p")).forEach(
        (p) => (p.style.display = "none")
      );
      const AudioContextClass =
        window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) {
        console.error("Web Audio API is not supported in this browser.");
        return;
      }
      const ctx = new AudioContextClass();
      const src = ctx.createMediaElementSource(video);
      const node = ctx.createGain();
      node.gain.value = 1.0;
      src.connect(node);
      node.connect(ctx.destination);
      video.play().catch((err) => console.error("Video play failed:", err));
      userEvents.forEach((eventType) => {
        window.removeEventListener(eventType, initializeInteraction, {
          capture: true,
        });
      });
    }
    const userEvents = ["click", "pointerdown", "keydown", "touchend", "wheel"];
    userEvents.forEach((eventType) => {
      window.addEventListener(eventType, initializeInteraction, {
        once: true,
        capture: true,
      });
    });
  </script>
